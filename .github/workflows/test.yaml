name: Test

on:
  workflow_dispatch:
  push:
    branches: [ main, dtelecom-db, v4 ]
  pull_request:
    branches: [ main, dtelecom-db, v4 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test
