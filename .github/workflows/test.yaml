name: Test

on:
  workflow_dispatch:
  push:
    branches: [ main, dtelecom-db, v4 ]
  pull_request:
    branches: [ main, dtelecom-db, v4 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Pack the tested SDK
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        with:
          name: consumer-package
          path: ${{ runner.temp }}/dtelecom-server-sdk-js-*.tgz

  consumer:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.18.0', '22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: ${{ runner.temp }}
      - name: Install and exercise a fresh consumer
        run: |
          consumer=$(mktemp -d)
          cp test/consumer.mjs "$consumer/"
          cd "$consumer"
          npm init -y
          npm install --engine-strict "$RUNNER_TEMP"/dtelecom-server-sdk-js-*.tgz
          node consumer.mjs
